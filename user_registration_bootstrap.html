<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign up</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5" style="max-width:400px">
    <h3>Sign up</h3>
    {% if message %}<div class="alert alert-danger">{{ message }}</div>{% endif %}
    <form method="post" action="{% url 'onlinecourse:registration' %}">
        {% csrf_token %}
        <input class="form-control mb-2" type="text" name="username" placeholder="Username" required>
        <input class="form-control mb-2" type="text" name="firstname" placeholder="First name" required>
        <input class="form-control mb-2" type="text" name="lastname" placeholder="Last name" required>
        <input class="form-control mb-2" type="password" name="psw" placeholder="Password" required>
        <button class="btn btn-primary" type="submit">Sign up</button>
        <a href="{% url 'onlinecourse:login' %}">Login</a>
    </form>
</div>
</body>
</html>
